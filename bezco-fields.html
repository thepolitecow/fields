<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
<title>Bezco &amp; 845 Field Map — 2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15150f;
    --panel: #1f1e17;
    --panel-hi: #2a2922;
    --border: #3a382c;
    --text: #ece9dc;
    --text-dim: #9d9a88;
    --amber: #d97706;
    --amber-hi: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    overflow: hidden; overscroll-behavior: none;
  }
  #app {
    display: grid;
    grid-template-columns: 340px 1fr;
    grid-template-rows: 56px 1fr;
    height: 100vh; height: 100dvh;
  }
  header {
    grid-column: 1 / -1;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 16px; gap: 12px; z-index: 1000;
  }
  .brand {
    font-family: 'Oswald', sans-serif;
    font-weight: 700; font-size: 20px;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text); flex-shrink: 0;
  }
  .brand .year { color: var(--amber); margin-left: 6px; }
  .search-wrap { flex: 1; position: relative; max-width: 420px; }
  #search {
    width: 100%;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px 8px 34px;
    font-family: inherit; font-size: 14px;
    border-radius: 2px; outline: none;
  }
  #search:focus { border-color: var(--amber); }
  .search-wrap::before {
    content: ''; position: absolute;
    left: 12px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px;
    border: 2px solid var(--text-dim); border-radius: 50%;
  }
  .search-wrap::after {
    content: ''; position: absolute;
    left: 22px; top: 60%;
    width: 7px; height: 2px;
    background: var(--text-dim);
    transform: rotate(45deg);
  }
  .toggle-list {
    display: none;
    background: transparent; border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    font-family: 'Oswald', sans-serif;
    letter-spacing: 0.05em; text-transform: uppercase;
    font-size: 12px; cursor: pointer; border-radius: 2px;
  }
  aside {
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .legend { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .legend-title, .list-title {
    font-family: 'Oswald', sans-serif;
    font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--text-dim);
  }
  .legend-title { margin-bottom: 10px; }
  .list-title { padding: 8px 16px; }
  .legend-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 6px 12px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text);
  }
  .legend-swatch {
    width: 14px; height: 14px;
    border: 1px solid rgba(0,0,0,0.4); flex-shrink: 0;
  }
  .field-list { flex: 1; padding: 8px 0; }
  .field-row {
    display: grid;
    grid-template-columns: 36px 1fr auto;
    align-items: center; gap: 10px;
    padding: 9px 16px; cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.12s, border-color 0.12s;
  }
  .field-row:hover, .field-row.active {
    background: var(--panel-hi);
    border-left-color: var(--amber);
  }
  .field-num {
    font-family: 'Oswald', sans-serif;
    font-weight: 600; font-size: 14px;
    color: #000;
    width: 32px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 2px;
  }
  .field-name {
    font-size: 13px; font-weight: 500; line-height: 1.3;
    min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .field-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; color: var(--text-dim); text-align: right;
  }
  main { position: relative; background: #0a0a08; }
  #map { width: 100%; height: 100%; }

  .leaflet-popup-content-wrapper {
    background: var(--panel); color: var(--text);
    border-radius: 3px; border: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .leaflet-popup-tip {
    background: var(--panel); border: 1px solid var(--border);
  }
  .leaflet-popup-content {
    margin: 14px 16px;
    font-family: 'IBM Plex Sans', sans-serif;
    min-width: 220px;
  }
  .leaflet-popup-close-button { color: var(--text-dim) !important; }
  .popup-num {
    font-family: 'Oswald', sans-serif;
    font-weight: 700; font-size: 11px;
    letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--amber); margin-bottom: 2px;
  }
  .popup-name {
    font-family: 'Oswald', sans-serif;
    font-size: 22px; font-weight: 600;
    letter-spacing: 0.02em; line-height: 1.1;
    margin-bottom: 10px; color: var(--text);
  }
  .popup-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 0; border-top: 1px solid var(--border);
    font-size: 13px; gap: 12px;
  }
  .popup-row .k {
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .popup-row .v {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; font-weight: 500;
  }
  .popup-crop {
    display: inline-block;
    padding: 3px 10px; border-radius: 2px;
    font-family: 'Oswald', sans-serif;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: #000; margin-top: 10px;
  }
  .directions-btn {
    display: block; width: 100%;
    margin-top: 12px; padding: 11px 12px;
    background: var(--amber); color: #1a1005;
    text-decoration: none; text-align: center;
    font-family: 'Oswald', sans-serif;
    font-weight: 600; font-size: 14px;
    letter-spacing: 0.08em; text-transform: uppercase;
    border-radius: 2px; border: none; cursor: pointer;
    transition: background 0.12s;
  }
  .directions-btn:hover { background: var(--amber-hi); }
  .directions-btn svg { vertical-align: middle; margin-right: 6px; }

  .field-label {
    background: transparent; border: none; box-shadow: none;
  }
  .field-label-inner {
    font-family: 'Oswald', sans-serif;
    font-weight: 700; font-size: 13px;
    color: #fff;
    text-shadow:
      -1px -1px 0 #000, 1px -1px 0 #000,
      -1px  1px 0 #000, 1px  1px 0 #000,
       0 0 4px rgba(0,0,0,0.9);
    text-align: center; white-space: nowrap;
  }

  .map-controls {
    position: absolute; top: 12px; right: 12px; z-index: 500;
    display: flex; gap: 4px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 2px; padding: 3px;
  }
  .map-controls button {
    background: transparent; border: none; color: var(--text-dim);
    padding: 6px 10px;
    font-family: 'Oswald', sans-serif;
    font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; cursor: pointer; border-radius: 2px;
  }
  .map-controls button.active { background: var(--amber); color: #1a1005; }

  .map-controls .divider {
    width: 1px;
    background: var(--border);
    margin: 2px 2px;
  }
  .locate-btn {
    display: flex !important;
    align-items: center;
    gap: 6px;
  }
  .locate-btn svg { display: block; }
  .locate-btn.pulsing svg { animation: btnPulse 1.2s ease-in-out infinite; }
  @keyframes btnPulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }

  /* User location marker */
  .user-dot-wrap {
    background: transparent !important;
    border: none !important;
    overflow: visible !important;
  }
  .user-cone {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 80px;
    height: 80px;
    margin: -40px;
    transform-origin: center center;
    transform: rotate(0deg);
    transition: transform 0.25s linear;   /* COMPASS SMOOTHING: was 0.15s */
    pointer-events: none;
    display: none;  /* hidden until first compass reading */
  }
  .user-cone.has-heading { display: block; }
  .user-dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #3b82f6;
    border: 3px solid #fff;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.3),
      0 0 12px rgba(59,130,246,0.7);
    animation: dotGlow 2s ease-in-out infinite;
  }
  @keyframes dotGlow {
    0%, 100% { box-shadow: 0 0 0 1px rgba(0,0,0,0.3), 0 0 10px rgba(59,130,246,0.6); }
    50%      { box-shadow: 0 0 0 1px rgba(0,0,0,0.3), 0 0 18px rgba(59,130,246,1.0); }
  }

  /* Toast messages */
  .toast {
    position: absolute;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--amber);
    color: var(--text);
    padding: 12px 16px;
    font-size: 13px;
    max-width: 320px;
    line-height: 1.4;
    border-radius: 2px;
    z-index: 1100;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .toast button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 0 4px;
    flex-shrink: 0;
  }

  @media (max-width: 720px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 56px 1fr; }
    aside {
      position: fixed; top: 56px; left: 0;
      width: min(340px, 90vw);
      height: calc(100vh - 56px); height: calc(100dvh - 56px);
      transform: translateX(-100%);
      transition: transform 0.2s ease;
      z-index: 900;
      box-shadow: 4px 0 20px rgba(0,0,0,0.5);
    }
    aside.open { transform: translateX(0); }
    .toggle-list { display: inline-block; }
    .brand { font-size: 16px; }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <button class="toggle-list" id="toggleList">Fields</button>
    <div class="brand">Bezco &amp; 845 Field Map<span class="year">/ 2026</span></div>
    <div class="search-wrap">
      <input id="search" placeholder="Search field name or number…" autocomplete="off">
    </div>
  </header>

  <aside id="sidebar">
    <div class="legend">
      <div class="legend-title">Crops</div>
      <div class="legend-grid" id="legend"></div>
    </div>
    <div class="field-list">
      <div class="list-title">Fields (<span id="fieldCount">0</span>)</div>
      <div id="fieldList"></div>
    </div>
  </aside>

  <main>
    <div class="map-controls">
      <button data-basemap="sat" class="active">Satellite</button>
      <button data-basemap="street">Street</button>
      <div class="divider"></div>
      <button id="locateBtn" class="locate-btn" title="Show my location">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        </svg>
        Locate
      </button>
    </div>
    <div id="map"></div>
  </main>
</div>

  alfalfa:     { label: "Alfalfa",      color: "#4ade80" },
  barley:      { label: "Barley",       color: "#f59e0b" },

/* DLS (Dominion Land Survey) → Lat/Lng. Alberta, West of 4th Meridian. */
const TWP_DEG_LAT = 6 * 1.609344 / 111.32;
const RNG_DEG_LNG = 6 * 1.609344 / (111.32 * Math.cos(49.7 * Math.PI / 180));
const BASE_LAT = 49.0;
const BASE_LNG = -110.0;

/* Piecewise calibration — separate transforms for Range 19 (east block) and
   Range 20 (west block). A DLS correction-line jog between them means one
   global transform can't cover both without drift. Derived from 9 known
   reference corners (max residual ~28 m, average ~13 m):

     Range 20 — full affine from 5 corners:
       • SW of SE 2-9-20  (New Home)    at 49.6985942, -112.6116882
       • SE of NE 27-8-20 (Potato Bldg) at 49.6766213, -112.6230919
       • SW of SE 29-7-20 (Hickey)      at 49.5817356, -112.6787277
       • SE of N  12-9-20 (Pol)         at 49.7208943, -112.5790719
       • NW of SW 6-9-20  (Androkovich) at 49.7052398, -112.7109423

     Range 19 — full affine from 4 corners:
       • SE of SE 29-8-19 (Homestead S) at 49.6695361, -112.5336235
       • NW of SW 8-9-19  (Rowley)      at 49.7202386, -112.5556568
       • NW of NW 31-8-19 (Stim #2)     at 49.6983352, -112.5783198
       • SE of SW 31-8-19 (Stim #1)     at 49.6843231, -112.5674760

   To refine or add a third region, add another entry to TRANSFORMS below
   and update the selector logic inside applyAffine().                      */
const TRANSFORMS = {
  // Range 20+: full affine
  r20: {
    a11: 1.0072607904873516,   a12: 0.007349073573585337,  b1:  0.4712948731340981,
    a21: 0.006268757464804781, a22: 0.9839218788333749,    b2: -2.151965535615396,
  },
  // Range 19: full affine
  r19: {
    a11: 0.9991813591636005,   a12: -0.0006227478037336827, b1: -0.024802283866924804,
    a21: 0.011850251483597668, a22: 1.0090873227189774,     b2:  0.4035404399975191,
  },
};
function applyAffine(lat, lng, range) {
  const t = (range <= 19) ? TRANSFORMS.r19 : TRANSFORMS.r20;
  return [
    t.a11 * lat + t.a12 * lng + t.b1,
    t.a21 * lat + t.a22 * lng + t.b2,
  ];
}
function applyAffine(lat, lng, range) {
  const t = (range <= 19) ? TRANSFORMS.r19 : TRANSFORMS.r20;
  return [
    t.a11 * lat + t.a12 * lng + t.b1,
    t.a21 * lat + t.a22 * lng + t.b2,
  ];
}

function parseLegal(loc) {
  const m = loc.trim().match(/^(NW|NE|SW|SE|N|S|E|W)\s+(\d+)-(\d+)-(\d+)$/i);
  if (!m) return null;
  return { quarter: m[1].toUpperCase(), section: +m[2], township: +m[3], range: +m[4] };
}

function dlsBounds(legal) {
  const { quarter, section, township, range } = legal;
  const twpSouth = BASE_LAT + (township - 1) * TWP_DEG_LAT;
  const twpWest  = BASE_LNG - range * RNG_DEG_LNG;

  const row = Math.floor((section - 1) / 6);
  const mod = (section - 1) % 6;
  const col = (row % 2 === 0) ? (5 - mod) : mod;

  const secH = TWP_DEG_LAT / 6;
  const secW = RNG_DEG_LNG / 6;
  const secSouth = twpSouth + row * secH;
  const secWest  = twpWest  + col * secW;

  let latFrac, lngFrac, hFrac = 0.5, wFrac = 0.5;
  switch (quarter) {
    case "NW": latFrac = 0.50; lngFrac = 0.00; break;
    case "NE": latFrac = 0.50; lngFrac = 0.50; break;
    case "SW": latFrac = 0.00; lngFrac = 0.00; break;
    case "SE": latFrac = 0.00; lngFrac = 0.50; break;
    case "N":  latFrac = 0.50; lngFrac = 0.00; hFrac = 0.5; wFrac = 1.0; break;
    case "S":  latFrac = 0.00; lngFrac = 0.00; hFrac = 0.5; wFrac = 1.0; break;
    case "E":  latFrac = 0.00; lngFrac = 0.50; hFrac = 1.0; wFrac = 0.5; break;
    case "W":  latFrac = 0.00; lngFrac = 0.00; hFrac = 1.0; wFrac = 0.5; break;
  }
  // Raw (untransformed) rectangle corners within the section
  const sRaw = secSouth + latFrac * secH;
  const wRaw = secWest  + lngFrac * secW;
  const nRaw = sRaw + hFrac * secH;
  const eRaw = wRaw + wFrac * secW;

  // Transform all 4 corners through the affine. Order: SW, NW, NE, SE (CCW-ish).
  const sw = applyAffine(sRaw, wRaw, range);
  const nw = applyAffine(nRaw, wRaw, range);
  const ne = applyAffine(nRaw, eRaw, range);
  const se = applyAffine(sRaw, eRaw, range);

  const polygon = [sw, nw, ne, se];
  const center = [
    (sw[0] + nw[0] + ne[0] + se[0]) / 4,
    (sw[1] + nw[1] + ne[1] + se[1]) / 4,
  ];
  return { polygon, center };
}

/* Build map */
const map = L.map('map', { center: [49.64, -112.55], zoom: 11, zoomControl: true });

const satTiles = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { attribution: 'Imagery © Esri', maxZoom: 19 }
);
const streetTiles = L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { attribution: '© OpenStreetMap', maxZoom: 19 }
);
satTiles.addTo(map);

document.querySelectorAll('.map-controls button[data-basemap]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.map-controls button[data-basemap]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (btn.dataset.basemap === 'sat') { map.removeLayer(streetTiles); satTiles.addTo(map); }
    else                                { map.removeLayer(satTiles);    streetTiles.addTo(map); }
  });
});

/* Render fields */
const fieldLayers = {};
const fieldPolygons = {};  // id → polygon, for alignNSWith lookups
const allLatLngs = [];

for (const field of FIELDS) {
  const legal = parseLegal(field.location);
  if (!legal) { console.warn('Bad location:', field); continue; }

  // Per-field corner override: if `corners: {sw,nw,ne,se}` is supplied,
  // use it verbatim and skip the DLS-derived polygon. Useful when the
  // piecewise affine still leaves a field visibly misaligned.
  // Each corner can be either:
  //   • an explicit [lat, lng] pair, OR
  //   • a reference { from: <id>, corner: 'sw'|'nw'|'ne'|'se' } that
  //     borrows that corner from another field's polygon (the referenced
  //     field must appear earlier in the FIELDS array).
  let polygon;
  if (field.corners) {
    const resolve = (corner, label) => {
      if (Array.isArray(corner)) return corner;
      if (corner && corner.from != null && corner.corner) {
        const ref = fieldPolygons[corner.from];
        if (!ref) {
          console.warn(`Field ${field.id} ${label}: reference to field ${corner.from} — not yet rendered`);
          return [0, 0];
        }
        const idx = { sw: 0, nw: 1, ne: 2, se: 3 }[corner.corner];
        return ref[idx].slice();
      }
      console.warn(`Field ${field.id} ${label}: invalid corner spec`, corner);
      return [0, 0];
    };
    const c = field.corners;
    polygon = [resolve(c.sw, 'sw'), resolve(c.nw, 'nw'), resolve(c.ne, 'ne'), resolve(c.se, 'se')];
  } else {
    polygon = dlsBounds(legal).polygon;
  }

  // N/S alignment override: if `alignNSWith: <id>` is supplied, take the
  // south and north latitudes from that field's polygon and apply them
  // to this polygon's corners. Keeps east/west position untouched.
  // (Reference field must appear earlier in FIELDS.)
  if (field.alignNSWith != null) {
    const ref = fieldPolygons[field.alignNSWith];
    if (ref) {
      const southLat = (ref[0][0] + ref[3][0]) / 2;  // avg of ref SW, SE
      const northLat = (ref[1][0] + ref[2][0]) / 2;  // avg of ref NW, NE
      polygon = [
        [southLat, polygon[0][1]],  // SW: new lat, keep lng
        [northLat, polygon[1][1]],  // NW
        [northLat, polygon[2][1]],  // NE
        [southLat, polygon[3][1]],  // SE
      ];
    } else {
      console.warn(`Field ${field.id}: alignNSWith=${field.alignNSWith} not found (must appear earlier in FIELDS)`);
    }
  }

  fieldPolygons[field.id] = polygon;

  const center = [
    (polygon[0][0] + polygon[1][0] + polygon[2][0] + polygon[3][0]) / 4,
    (polygon[0][1] + polygon[1][1] + polygon[2][1] + polygon[3][1]) / 4,
  ];
  const lat = field.lat ?? center[0];
  const lng = field.lng ?? center[1];
  const color = (CROPS[field.crop] || CROPS.other).color;

  const shape = L.polygon(polygon, {
    color: '#000', weight: 1.5,
    fillColor: color, fillOpacity: 0.55,
  }).addTo(map);

  L.marker([lat, lng], {
    icon: L.divIcon({
      className: 'field-label',
      html: `<div class="field-label-inner">${field.id}</div>`,
      iconSize: [28, 20], iconAnchor: [14, 10],
    }),
    interactive: false,
  }).addTo(map);

  shape.bindPopup(buildPopup(field, lat, lng), { maxWidth: 300 });
  fieldLayers[field.id] = { rect: shape, center: [lat, lng], field };
  allLatLngs.push(...polygon);
}
if (allLatLngs.length) map.fitBounds(allLatLngs, { padding: [30, 30] });

function buildPopup(f, lat, lng) {
  const crop = CROPS[f.crop] || CROPS.other;
  const gmaps = `https://www.google.com/maps/dir/?api=1&destination=${lat.toFixed(6)},${lng.toFixed(6)}`;
  const doorRow  = f.doorCode ? `<div class="popup-row"><span class="k">Door Code</span><span class="v">${f.doorCode}</span></div>` : '';
  const acresRow = (f.acres != null) ? `<div class="popup-row"><span class="k">Acres</span><span class="v">${f.acres}</span></div>` : '';
  return `
    <div class="popup-num">Field ${f.id}</div>
    <div class="popup-name">${escapeHtml(f.name)}</div>
    <div class="popup-row"><span class="k">Location</span><span class="v">${f.location}</span></div>
    ${acresRow}${doorRow}
    <div class="popup-row"><span class="k">Coords</span><span class="v">${lat.toFixed(4)}, ${lng.toFixed(4)}</span></div>
    <span class="popup-crop" style="background:${crop.color}">${crop.label}</span>
    <a class="directions-btn" href="${gmaps}" target="_blank" rel="noopener">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="3 11 22 2 13 21 11 13 3 11"/>
      </svg>Directions
    </a>`;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
}

/* Legend */
const legendEl = document.getElementById('legend');
const usedCrops = new Set(FIELDS.map(f => f.crop));
for (const [key, crop] of Object.entries(CROPS)) {
  if (!usedCrops.has(key)) continue;
  const el = document.createElement('div');
  el.className = 'legend-item';
  el.innerHTML = `<span class="legend-swatch" style="background:${crop.color}"></span>${crop.label}`;
  legendEl.appendChild(el);
}

/* Field list + search */
const fieldListEl = document.getElementById('fieldList');
const searchEl = document.getElementById('search');
const countEl = document.getElementById('fieldCount');

function renderList(filter = '') {
  fieldListEl.innerHTML = '';
  const q = filter.trim().toLowerCase();
  const sorted = [...FIELDS].sort((a, b) => {
    const na = typeof a.id === 'number' ? a.id : 999;
    const nb = typeof b.id === 'number' ? b.id : 999;
    return na - nb;
  });
  let count = 0;
  for (const f of sorted) {
    if (q) {
      const hay = `${f.id} ${f.name} ${f.location}`.toLowerCase();
      if (!hay.includes(q)) continue;
    }
    count++;
    const crop = CROPS[f.crop] || CROPS.other;
    const row = document.createElement('div');
    row.className = 'field-row';
    row.dataset.id = f.id;
    row.innerHTML = `
      <div class="field-num" style="background:${crop.color};">${f.id}</div>
      <div class="field-name">${escapeHtml(f.name)}</div>
      <div class="field-meta">${f.location}</div>`;
    row.addEventListener('click', () => focusField(f.id));
    fieldListEl.appendChild(row);
  }
  countEl.textContent = count;
}

function focusField(id) {
  const layer = fieldLayers[id];
  if (!layer) return;
  map.flyTo(layer.center, 15, { duration: 0.6 });
  setTimeout(() => layer.rect.openPopup(layer.center), 650);

  document.querySelectorAll('.field-row').forEach(r => r.classList.remove('active'));
  const row = document.querySelector(`.field-row[data-id="${CSS.escape(String(id))}"]`);
  if (row) row.classList.add('active');

  if (window.innerWidth <= 720) {
    document.getElementById('sidebar').classList.remove('open');
  }
}

searchEl.addEventListener('input', e => renderList(e.target.value));
renderList();

document.getElementById('toggleList').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});
map.on('click', () => {
  if (window.innerWidth <= 720) document.getElementById('sidebar').classList.remove('open');
});

/* -------------------------------------------------------------------------
   User location (live GPS tracking)
   -------------------------------------------------------------------------
   - Browser prompts for location permission on first use.
   - Updates live as the device moves (watchPosition).
   - On first fix, the map flies to the location and zooms in.
   - Toggle off by tapping the button again.
   - Clear error toasts if permission denied / GPS off / timeout.
   - HTTPS or localhost is required by browsers for geolocation;
     opening the file via file:// works in some browsers but not all.
   ------------------------------------------------------------------------- */

const locateBtn = document.getElementById('locateBtn');
let userDot = null;
let userCircle = null;
let watchId = null;
let firstFix = true;
let orientationHandler = null;
let absoluteEventReceived = false;   // ORIENTATION FIXES 2026 — see block below

/* ============================================================================
   COMPASS SMOOTHING  —  added 2026
   ----------------------------------------------------------------------------
   Raw orientation events arrive ~60 Hz with sensor noise, which made the cone
   jitter badly. This block throttles updates, applies a dead zone, eases the
   rotation toward the target, and works with a slightly longer CSS transition.

   TO REVERT to the previous unsmoothed behavior:
     1. Delete this SMOOTHING config block and the smoothingTick interval.
     2. In updateConeRotation(), restore the original body:
           let delta = headingDegrees - ((lastRenderedRotation % 360) + 360) % 360;
           if (delta >  180) delta -= 360;
           if (delta < -180) delta += 360;
           lastRenderedRotation += delta;
           cone.classList.add('has-heading');
           cone.style.transform = `rotate(${lastRenderedRotation}deg)`;
        and replace the smoothing-aware version below.
     3. Restore the old `let lastRenderedRotation = 0;` declaration (delete the
        targetHeading/currentHeading/smoothingTimer vars).
     4. In .user-cone CSS, change `transition: transform 0.25s linear;` back to
        `transition: transform 0.15s linear;`.
     5. In clearUserLocation(), delete the `stopSmoothing();` line.
   ============================================================================ */
const SMOOTHING = {
  updateMs: 100,    // throttle: render the cone at most this often (10 Hz)
  deadZone: 3,     // ignore raw heading changes smaller than this many degrees
  easing: 0.25,    // each render moves 25 % of the remaining distance to target
};
let targetHeading = null;       // most recent heading from sensor (after dead zone)
let currentHeading = null;      // currently rendered heading (smoothed toward target)
let smoothingTimer = null;

function startSmoothing() {
  if (smoothingTimer) return;
  smoothingTimer = setInterval(smoothingTick, SMOOTHING.updateMs);
}
function stopSmoothing() {
  if (smoothingTimer) { clearInterval(smoothingTimer); smoothingTimer = null; }
  targetHeading = null;
  currentHeading = null;
}
function smoothingTick() {
  if (targetHeading == null) return;
  if (currentHeading == null) { currentHeading = targetHeading; renderCone(currentHeading); return; }
  // Shortest angular distance from current to target
  let delta = targetHeading - currentHeading;
  delta = ((delta + 540) % 360) - 180;
  if (Math.abs(delta) < 0.1) return;  // close enough; skip render
  currentHeading += delta * SMOOTHING.easing;
  renderCone(currentHeading);
}
/* ========================== end COMPASS SMOOTHING ========================== */

function showToast(msg, ms = 6000) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  const span = document.createElement('span');
  span.textContent = msg;
  const btn = document.createElement('button');
  btn.setAttribute('aria-label', 'dismiss');
  btn.textContent = '×';
  btn.addEventListener('click', () => t.remove());
  t.appendChild(span);
  t.appendChild(btn);
  document.querySelector('main').appendChild(t);
  if (ms) setTimeout(() => { if (t.parentNode) t.remove(); }, ms);
}

function clearUserLocation() {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  if (userDot)    { map.removeLayer(userDot);    userDot = null; }
  if (userCircle) { map.removeLayer(userCircle); userCircle = null; }
  stopOrientation();
  stopSmoothing();   // COMPASS SMOOTHING: stop the render tick + reset state
  firstFix = true;
  locateBtn.classList.remove('active', 'pulsing');
}

/* Compass / device orientation
   - iOS 13+ Safari: requires permission via DeviceOrientationEvent.requestPermission()
     and provides webkitCompassHeading (already in 0-360 clockwise-from-north).
   - Android/standard: just attach listener; convert event.alpha (CCW from north).
   - If neither is available, the cone simply stays hidden and the dot still works. */
function startOrientation() {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(state => { if (state === 'granted') attachOrientationListener(); })
      .catch(() => {});  // user dismissed prompt — fail quietly, dot still works
  } else {
    attachOrientationListener();
  }
}

/* ============================================================================
   ORIENTATION FIXES  —  added 2026
   ----------------------------------------------------------------------------
   Two bugs were corrected here:
     1. The handler was being called by BOTH 'deviceorientation' AND
        'deviceorientationabsolute', mixing two reference frames (only the
        latter is guaranteed to be relative to true north). Fix: once we see
        an absolute event, ignore the relative ones. Also reject relative
        events that don't have event.absolute === true.
     2. The compass heading didn't account for screen rotation. When the
        phone is held in landscape or upside-down, the cone needs to be
        counter-rotated by screen.orientation.angle (or window.orientation
        on older Safari).

   TO REVERT to the previous behavior (the buggy version):
     1. Delete the `let absoluteEventReceived = false;` declaration above.
     2. Delete the `absoluteEventReceived = false;` line inside stopOrientation().
     3. Replace the attachOrientationListener body below with the original:
          orientationHandler = function(event) {
            let heading = null;
            if (typeof event.webkitCompassHeading === 'number') {
              heading = event.webkitCompassHeading;
            } else if (typeof event.alpha === 'number') {
              heading = (360 - event.alpha) % 360;
            }
            if (heading != null) updateConeRotation(heading);
          };
   ============================================================================ */
function attachOrientationListener() {
  if (orientationHandler) return;
  orientationHandler = function(event) {
    const isAbsoluteEvent = (event.type === 'deviceorientationabsolute');
    if (isAbsoluteEvent) absoluteEventReceived = true;
    // Once we've ever seen an absolute event, ignore non-absolute ones (Android
    // Chrome fires both; using both mixes north-relative and startup-relative).
    if (!isAbsoluteEvent && absoluteEventReceived) return;

    let heading = null;
    if (typeof event.webkitCompassHeading === 'number') {
      // iOS: always relative to true north
      heading = event.webkitCompassHeading;
    } else if (typeof event.alpha === 'number' &&
               (isAbsoluteEvent || event.absolute === true)) {
      // Standard: alpha is CCW from north; convert to CW from north
      heading = (360 - event.alpha) % 360;
    }
    if (heading == null) return;

    // Compensate for screen rotation. screen.orientation.angle is the modern
    // property; window.orientation is the legacy fallback for older Safari.
    let screenAngle = 0;
    if (screen.orientation && typeof screen.orientation.angle === 'number') {
      screenAngle = screen.orientation.angle;
    } else if (typeof window.orientation === 'number') {
      screenAngle = window.orientation;
    }
    heading = ((heading - screenAngle) % 360 + 360) % 360;

    updateConeRotation(heading);
  };
  window.addEventListener('deviceorientationabsolute', orientationHandler, true);
  window.addEventListener('deviceorientation',         orientationHandler, true);
}
/* ========================== end ORIENTATION FIXES ========================== */

function stopOrientation() {
  if (!orientationHandler) return;
  window.removeEventListener('deviceorientationabsolute', orientationHandler);
  window.removeEventListener('deviceorientation',         orientationHandler);
  orientationHandler = null;
  absoluteEventReceived = false;   // ORIENTATION FIXES 2026
}

function updateConeRotation(headingDegrees) {
  // COMPASS SMOOTHING: feed the raw sensor reading to the smoother (with dead
  // zone). The smoothingTick interval (started in startUserLocation) is what
  // actually moves the cone toward this target over time.
  if (targetHeading == null) { targetHeading = headingDegrees; return; }
  // Shortest angular distance from current target to new reading
  let delta = headingDegrees - targetHeading;
  delta = ((delta + 540) % 360) - 180;
  if (Math.abs(delta) < SMOOTHING.deadZone) return;  // ignore tiny jitter
  targetHeading += delta;
}

function renderCone(headingDegrees) {
  if (!userDot) return;
  const el = userDot.getElement();
  if (!el) return;
  const cone = el.querySelector('.user-cone');
  if (!cone) return;
  cone.classList.add('has-heading');
  cone.style.transform = `rotate(${headingDegrees}deg)`;
}

function startUserLocation() {
  if (!('geolocation' in navigator)) {
    showToast('Geolocation is not supported by this browser.');
    return;
  }
  locateBtn.classList.add('pulsing');
  startOrientation();
  startSmoothing();   // COMPASS SMOOTHING: begin the 100 ms render tick

  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      const { latitude, longitude, accuracy } = pos.coords;
      const latlng = [latitude, longitude];

      if (!userDot) {
        userDot = L.marker(latlng, {
          icon: L.divIcon({
            className: 'user-dot-wrap',
            html: `
              <svg class="user-cone" width="80" height="80" viewBox="-40 -40 80 80">
                <defs>
                  <linearGradient id="userConeGrad" x1="50%" y1="100%" x2="50%" y2="0%">
                    <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.65"/>
                    <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
                  </linearGradient>
                </defs>
                <path d="M0,0 L-23,-33 A40,40 0 0,1 23,-33 Z" fill="url(#userConeGrad)"/>
              </svg>
              <div class="user-dot"></div>
            `,
            iconSize: [16, 16],
            iconAnchor: [8, 8],
          }),
          interactive: false,
          zIndexOffset: 1000,
        }).addTo(map);
        userCircle = L.circle(latlng, {
          radius: accuracy,
          color: '#3b82f6', weight: 1,
          fillColor: '#3b82f6', fillOpacity: 0.12,
          interactive: false,
        }).addTo(map);
      } else {
        userDot.setLatLng(latlng);
        userCircle.setLatLng(latlng).setRadius(accuracy);
      }

      if (firstFix) {
        map.flyTo(latlng, Math.max(map.getZoom(), 15), { duration: 0.6 });
        firstFix = false;
      }
      locateBtn.classList.remove('pulsing');
      locateBtn.classList.add('active');
    },
    (err) => {
      clearUserLocation();
      if (err.code === err.PERMISSION_DENIED) {
        showToast("Location permission was denied. Enable it in your browser's site settings (lock icon in the address bar) and tap Locate again.", 9000);
      } else if (err.code === err.POSITION_UNAVAILABLE) {
        showToast("Location unavailable. Please turn on your device's location services (GPS) and try again.", 9000);
      } else if (err.code === err.TIMEOUT) {
        showToast("Location request timed out. Try again with a clearer view of the sky.", 7000);
      } else {
        showToast('Unable to get location: ' + err.message);
      }
    },
    {
      enableHighAccuracy: true,
      maximumAge: 15000,
      timeout: 20000,
    }
  );
}

locateBtn.addEventListener('click', () => {
  if (watchId !== null || userDot) clearUserLocation();
  else startUserLocation();
});
</script>
</body>
</html>
