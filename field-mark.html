<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1c1b17">
<title>Field Mark — GPS Point Logger</title>
<style>
  :root{
    --paper:#f3efe4;
    --paper2:#e9e3d4;
    --ink:#1c1b17;
    --ink2:#4a463c;
    --line:#cdc6b3;
    --hi:#e8550e;       /* safety orange */
    --hi-dark:#b53f08;
    --green:#2f7d3f;
    --amber:#c98a16;
    --red:#c23b22;
    --tag:#fffdf7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    background-image:
      repeating-linear-gradient(0deg, rgba(28,27,23,.025) 0 1px, transparent 1px 26px),
      radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.4), transparent 60%);
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 120px;}

  header{
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:3px solid var(--ink);
    padding:6px 2px 12px;margin-bottom:14px;
  }
  .brand{display:flex;align-items:baseline;gap:8px;}
  .brand h1{
    font-size:23px;margin:0;letter-spacing:.04em;font-weight:800;
    text-transform:uppercase;
  }
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--hi);box-shadow:0 0 0 3px rgba(232,85,14,.18);}
  .brand small{display:block;font-size:10px;letter-spacing:.22em;color:var(--ink2);text-transform:uppercase;margin-top:2px;}

  /* GPS status pill */
  .gps{
    text-align:right;font-size:11px;line-height:1.35;font-variant-numeric:tabular-nums;
  }
  .gps .state{font-weight:700;letter-spacing:.05em;text-transform:uppercase;}
  .gps .acc{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink2);}

  /* Big mark button */
  .markbtn{
    width:100%;border:none;cursor:pointer;
    background:var(--hi);color:#fff;
    border-radius:18px;
    padding:30px 18px;
    font-size:26px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    box-shadow:0 6px 0 var(--hi-dark), 0 10px 22px rgba(181,63,8,.32);
    transition:transform .06s ease, box-shadow .06s ease;
    display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .markbtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--hi-dark),0 4px 12px rgba(181,63,8,.3);}
  .markbtn:disabled{opacity:.55;}
  .markbtn .ic{font-size:34px;line-height:1;}
  .markbtn .sub{font-size:12px;font-weight:600;letter-spacing:.12em;opacity:.9;}

  .hint{font-size:11.5px;color:var(--ink2);text-align:center;margin:10px 4px 0;line-height:1.5;}

  /* Naming sheet */
  .sheet-bg{position:fixed;inset:0;background:rgba(20,19,15,.5);display:none;z-index:40;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--paper);border-top:4px solid var(--ink);
    border-radius:20px 20px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    max-width:560px;margin:0 auto;display:none;
    box-shadow:0 -10px 40px rgba(0,0,0,.25);
  }
  .sheet h2{margin:2px 0 4px;font-size:16px;text-transform:uppercase;letter-spacing:.05em;}
  .reading{
    font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--tag);
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:8px 0 14px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .reading .coords{line-height:1.5;}
  .accbadge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;color:#fff;white-space:nowrap;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .chip{
    border:2px solid var(--ink);background:var(--tag);color:var(--ink);
    border-radius:30px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;
  }
  .chip.sel{background:var(--ink);color:var(--paper);}

  label.fld{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink2);display:block;margin:0 0 4px;}
  input.txt,textarea.txt{
    width:100%;font-size:16px;padding:11px 12px;border:2px solid var(--line);border-radius:11px;
    background:var(--tag);color:var(--ink);font-family:inherit;
  }
  input.txt:focus,textarea.txt:focus{outline:none;border-color:var(--hi);}
  textarea.txt{resize:vertical;min-height:48px;margin-top:10px;}

  .sheet-actions{display:flex;gap:10px;margin-top:16px;}
  .btn{flex:1;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.03em;}
  .btn.primary{background:var(--hi);color:#fff;}
  .btn.ghost{background:transparent;border:2px solid var(--ink);color:var(--ink);}

  /* Saved list */
  .listhead{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 10px;}
  .listhead h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.16em;color:var(--ink2);}
  .count{font-size:12px;font-weight:700;background:var(--ink);color:var(--paper);border-radius:20px;padding:2px 10px;font-variant-numeric:tabular-nums;}

  .card{
    background:var(--tag);border:1px solid var(--line);border-left:6px solid var(--hi);
    border-radius:12px;padding:12px 13px;margin-bottom:11px;
    box-shadow:0 1px 0 rgba(0,0,0,.04);
  }
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card .name{font-weight:800;font-size:16px;line-height:1.25;}
  .card .type{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink2);margin-top:2px;}
  .card .co{font-family:ui-monospace,Menlo,monospace;font-size:13px;margin-top:8px;line-height:1.55;}
  .card .meta{font-size:11px;color:var(--ink2);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums;}
  .card .row{display:flex;gap:8px;margin-top:11px;}
  .mini{flex:1;border:1.5px solid var(--line);background:var(--paper);border-radius:9px;padding:8px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);text-align:center;text-decoration:none;}
  .mini.del{color:var(--red);border-color:rgba(194,59,34,.4);}
  .note{font-size:12.5px;color:var(--ink2);margin-top:8px;font-style:italic;}

  .empty{text-align:center;color:var(--ink2);font-size:13px;padding:30px 10px;border:2px dashed var(--line);border-radius:14px;}

  /* Export bar */
  .export{
    position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:560px;margin:0 auto;
    background:var(--paper2);border-top:2px solid var(--ink);
    padding:9px 10px calc(9px + env(safe-area-inset-bottom));
    display:flex;gap:7px;
  }
  .export button{
    flex:1;border:2px solid var(--ink);background:var(--tag);color:var(--ink);
    border-radius:10px;padding:9px 4px;font-size:11.5px;font-weight:700;cursor:pointer;letter-spacing:.02em;
  }
  .export button:disabled{opacity:.4;}

  .toast{
    position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:30px;
    font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .warn{background:#fdeee6;border:1px solid #e8bfa6;color:#8a3c12;font-size:12px;padding:10px 12px;border-radius:11px;margin-top:12px;line-height:1.5;display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>Field Mark</h1>
        <small>GPS Point Logger</small>
      </div>
    </div>
    <div class="gps">
      <div class="state" id="gpsState">GPS idle</div>
      <div class="acc" id="gpsAcc">tap to capture</div>
    </div>
  </header>

  <button class="markbtn" id="markBtn">
    <span class="ic">⊕</span>
    <span>Mark Location</span>
    <span class="sub" id="markSub">High-accuracy capture</span>
  </button>
  <p class="hint">Stand at the spot, hold steady, then tap. It listens for a few seconds and keeps the most accurate fix before you name it.</p>

  <div class="warn" id="secWarn"></div>

  <div class="listhead">
    <h3>Saved Points</h3>
    <span class="count" id="count">0</span>
  </div>
  <div id="list"></div>
</div>

<!-- Export bar -->
<div class="export">
  <button id="expCsv">CSV</button>
  <button id="expGeo">GeoJSON</button>
  <button id="expKml">KML</button>
  <button id="expCopy">Copy</button>
</div>

<!-- Naming sheet -->
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <h2 id="sheetTitle">Name this point</h2>
  <div class="reading">
    <span class="coords" id="sheetCoords">—</span>
    <span class="accbadge" id="sheetAcc">—</span>
  </div>
  <label class="fld">Type</label>
  <div class="chips" id="chips"></div>
  <label class="fld">Name / label</label>
  <input class="txt" id="nameInput" type="text" placeholder="e.g. North pivot, Main gate" autocomplete="off">
  <textarea class="txt" id="noteInput" placeholder="Notes (optional)"></textarea>
  <div class="sheet-actions">
    <button class="btn ghost" id="cancelBtn">Cancel</button>
    <button class="btn primary" id="saveBtn">Save Point</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // ---- storage: localStorage when available, in-memory fallback otherwise ----
  var mem = {};
  var store = {
    get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return (k in mem)? mem[k]:null; } },
    set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
  };
  var KEY = "fieldmark.points.v1";
  var TYPEKEY = "fieldmark.lasttype.v1";

  var TYPES = ["Pivot","Entry/Exit","Pumpsite","Gate","Hazard","Trough","Other"];

  var points = [];
  try { points = JSON.parse(store.get(KEY) || "[]"); } catch(e){ points = []; }

  var pending = null;     // current captured reading awaiting naming
  var editId = null;      // id being edited (re-name only)
  var selectedType = store.get(TYPEKEY) || TYPES[0];

  var $ = function(id){ return document.getElementById(id); };
  function save(){ store.set(KEY, JSON.stringify(points)); }
  function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove("show");},1900); }

  function accColor(m){ if(m==null) return "#777"; if(m<=6) return "var(--green)"; if(m<=15) return "var(--amber)"; return "var(--red)"; }
  function accText(m){ if(m==null) return "± ?"; return "± " + Math.round(m) + " m"; }
  function fmt(n){ return n.toFixed(6); }

  function timeStr(ts){
    var d = new Date(ts);
    return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " " +
           d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
  }

  // ---------- render saved list ----------
  function render(){
    var list = $("list");
    $("count").textContent = points.length;
    var hasPts = points.length>0;
    ["expCsv","expGeo","expKml","expCopy"].forEach(function(id){ $(id).disabled = !hasPts; });

    if(!hasPts){ list.innerHTML = '<div class="empty">No points yet. Tap <b>Mark Location</b> to log your first one.</div>'; return; }
    list.innerHTML = "";
    points.slice().reverse().forEach(function(p){
      var card = document.createElement("div");
      card.className = "card";
      var maps = "https://www.google.com/maps?q="+p.lat+","+p.lng;
      card.innerHTML =
        '<div class="top"><div><div class="name"></div><div class="type"></div></div>'+
        '<span class="accbadge"></span></div>'+
        '<div class="co">'+fmt(p.lat)+', '+fmt(p.lng)+'</div>'+
        '<div class="meta"><span>'+timeStr(p.ts)+'</span><span>'+(p.fixes?p.fixes+' fixes':'')+'</span></div>'+
        (p.note? '<div class="note"></div>':'')+
        '<div class="row">'+
          '<a class="mini" target="_blank" rel="noopener" href="'+maps+'">Open in Maps</a>'+
          '<button class="mini ed">Rename</button>'+
          '<button class="mini del">Delete</button>'+
        '</div>';
      card.querySelector(".name").textContent = p.name || "(unnamed)";
      card.querySelector(".type").textContent = p.type;
      var b = card.querySelector(".accbadge");
      b.textContent = accText(p.acc); b.style.background = accColor(p.acc);
      card.style.borderLeftColor = accColor(p.acc);
      if(p.note) card.querySelector(".note").textContent = p.note;
      card.querySelector(".del").onclick = function(){
        if(confirm('Delete "'+(p.name||"unnamed")+'"?')){ points = points.filter(function(x){return x.id!==p.id;}); save(); render(); toast("Deleted"); }
      };
      card.querySelector(".ed").onclick = function(){ openSheet(p); };
      list.appendChild(card);
    });
  }

  // ---------- naming sheet ----------
  function buildChips(){
    var c = $("chips"); c.innerHTML = "";
    TYPES.forEach(function(t){
      var el = document.createElement("button");
      el.className = "chip" + (t===selectedType?" sel":"");
      el.textContent = t;
      el.onclick = function(){ selectedType=t; store.set(TYPEKEY,t); buildChips(); };
      c.appendChild(el);
    });
  }

  function openSheet(existing){
    if(existing){
      editId = existing.id; pending = null;
      selectedType = existing.type;
      $("sheetTitle").textContent = "Edit point";
      $("sheetCoords").textContent = fmt(existing.lat)+", "+fmt(existing.lng);
      var b=$("sheetAcc"); b.textContent=accText(existing.acc); b.style.background=accColor(existing.acc);
      $("nameInput").value = existing.name||"";
      $("noteInput").value = existing.note||"";
    } else if(pending){
      editId = null;
      $("sheetTitle").textContent = "Name this point";
      $("sheetCoords").textContent = fmt(pending.lat)+", "+fmt(pending.lng);
      var bb=$("sheetAcc"); bb.textContent=accText(pending.acc); bb.style.background=accColor(pending.acc);
      $("nameInput").value = "";
      $("noteInput").value = "";
    } else return;
    buildChips();
    $("sheetBg").style.display="block";
    $("sheet").style.display="block";
    setTimeout(function(){ $("nameInput").focus(); }, 120);
  }
  function closeSheet(){
    $("sheetBg").style.display="none";
    $("sheet").style.display="none";
    pending=null; editId=null;
  }

  $("saveBtn").onclick = function(){
    var name = $("nameInput").value.trim();
    var note = $("noteInput").value.trim();
    if(editId){
      points.forEach(function(p){ if(p.id===editId){ p.name=name; p.note=note; p.type=selectedType; } });
      toast("Updated");
    } else if(pending){
      points.push({
        id: Date.now()+"-"+Math.random().toString(36).slice(2,7),
        name:name, type:selectedType, note:note,
        lat:pending.lat, lng:pending.lng, acc:pending.acc, fixes:pending.fixes, ts:Date.now()
      });
      toast("Saved");
    }
    save(); render(); closeSheet();
  };
  $("cancelBtn").onclick = closeSheet;
  $("sheetBg").onclick = closeSheet;

  // ---------- GPS capture (averaging / best-fix) ----------
  var capturing = false;
  function setState(s,a){ $("gpsState").textContent=s; if(a!=null) $("gpsAcc").textContent=a; }

  function capture(){
    if(capturing) return;
    if(!("geolocation" in navigator)){ toast("No GPS on this device/browser"); return; }
    capturing = true;
    var btn=$("markBtn"); btn.disabled=true;
    $("markSub").textContent="Locating…";
    setState("Acquiring…","waiting for fix");

    var best = null, fixes = 0, done = false, refineTimer = null;
    var REFINE = 6000;         // ms to keep refining AFTER the first fix arrives
    var GOOD_ENOUGH = 4;       // metres: lock in early if a fix is this tight

    // timeout is generous so a cold GPS / permission prompt isn't cut off
    var watchId = navigator.geolocation.watchPosition(onPos, onErr,
      { enableHighAccuracy:true, maximumAge:0, timeout:30000 });

    function onPos(pos){
      if(done) return;
      fixes++;
      var a = pos.coords.accuracy;
      if(!best || a < best.acc){
        best = { lat:pos.coords.latitude, lng:pos.coords.longitude, acc:a };
      }
      setState("Refining… ("+fixes+")", accText(best.acc));
      if(best.acc <= GOOD_ENOUGH){ finish(); return; }
      // start the refinement countdown only once we actually have a fix
      if(refineTimer === null){ refineTimer = setTimeout(finish, REFINE); }
    }

    function onErr(err){
      if(done) return; done = true;
      cleanup();
      handleErr(err);
    }

    function finish(){
      if(done) return; done = true;
      cleanup();
      if(!best){ setState("GPS idle","try again"); toast("Couldn't get a fix — try again"); return; }
      best.fixes = fixes;
      pending = best;
      setState("Fix locked", accText(best.acc));
      openSheet(null);
    }

    function cleanup(){
      if(refineTimer) clearTimeout(refineTimer);
      navigator.geolocation.clearWatch(watchId);
      capturing=false; btn.disabled=false; $("markSub").textContent="High-accuracy capture";
    }
  }

  function handleErr(err){
    setState("GPS idle","tap to capture");
    if(err.code===1) toast("Location permission denied");
    else if(err.code===2) toast("Position unavailable — open sky helps");
    else if(err.code===3) toast("Timed out — try again");
    else toast("GPS error");
  }

  $("markBtn").onclick = capture;

  // secure-context warning (geolocation needs https / localhost)
  if(!window.isSecureContext && location.protocol!=="file:"){
    var w=$("secWarn"); w.style.display="block";
    w.innerHTML = "⚠ GPS may be blocked because this page isn't served over HTTPS. Host it over https (e.g. GitHub Pages) for reliable location on a phone.";
  }

  // ---------- exports ----------
  function download(filename, text, mime){
    var blob = new Blob([text], {type:mime||"text/plain"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },100);
  }
  function csvEsc(s){ s=(s==null?"":String(s)); return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; }
  function stamp(){ return new Date().toISOString().slice(0,16).replace(/[:T]/g,"-"); }

  function toCSV(){
    var rows = ["name,type,latitude,longitude,accuracy_m,fixes,timestamp,notes"];
    points.forEach(function(p){
      rows.push([csvEsc(p.name),csvEsc(p.type),fmt(p.lat),fmt(p.lng),
        (p.acc!=null?Math.round(p.acc):""),(p.fixes||""),new Date(p.ts).toISOString(),csvEsc(p.note)].join(","));
    });
    return rows.join("\n");
  }
  function toGeoJSON(){
    return JSON.stringify({ type:"FeatureCollection", features: points.map(function(p){
      return { type:"Feature",
        geometry:{ type:"Point", coordinates:[+fmt(p.lng),+fmt(p.lat)] },
        properties:{ name:p.name, type:p.type, accuracy_m:p.acc, fixes:p.fixes, timestamp:new Date(p.ts).toISOString(), notes:p.note } };
    })}, null, 2);
  }
  function toKML(){
    var x = function(s){ return String(s==null?"":s).replace(/[<>&]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c];}); };
    var pm = points.map(function(p){
      return '  <Placemark>\n    <name>'+x(p.name||"unnamed")+'</name>\n'+
             '    <description>'+x(p.type+(p.note?" — "+p.note:""))+'</description>\n'+
             '    <Point><coordinates>'+fmt(p.lng)+','+fmt(p.lat)+',0</coordinates></Point>\n  </Placemark>';
    }).join("\n");
    return '<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2">\n<Document>\n<name>Field Mark export</name>\n'+pm+'\n</Document>\n</kml>';
  }

  $("expCsv").onclick = function(){ download("field-mark-"+stamp()+".csv", toCSV(), "text/csv"); toast("CSV downloaded"); };
  $("expGeo").onclick = function(){ download("field-mark-"+stamp()+".geojson", toGeoJSON(), "application/geo+json"); toast("GeoJSON downloaded"); };
  $("expKml").onclick = function(){ download("field-mark-"+stamp()+".kml", toKML(), "application/vnd.google-earth.kml+xml"); toast("KML downloaded"); };
  $("expCopy").onclick = function(){
    var txt = toCSV();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){toast("Copied to clipboard");},function(){fallbackCopy(txt);});
    } else fallbackCopy(txt);
  };
  function fallbackCopy(txt){
    var t=document.createElement("textarea"); t.value=txt; document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); toast("Copied to clipboard"); }catch(e){ toast("Copy failed"); }
    document.body.removeChild(t);
  }

  render();
})();
</script>
</body>
</html>
